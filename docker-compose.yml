name: ztplanet

# Persistent state is kept in ./data/* bind directories relative to the project directory.
# This file intentionally declares no Docker named volumes.

services:
  postgres:
    image: ${ZTPLANET_POSTGRES_IMAGE:-docker.io/dlaq/zerotier-planet-test:postgres-${ZTPLANET_RELEASE:-v1.1.0}}
    restart: unless-stopped
    env_file:
      - path: /etc/ztplanet/runtime.env
        required: false
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      app-network:
        ipv4_address: 172.31.255.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

  zerotier:
    image: ${ZTPLANET_ZEROTIER_IMAGE:-docker.io/dlaq/zerotier-planet-test:zerotier-${ZTPLANET_RELEASE:-v1.1.0}}
    restart: unless-stopped
    volumes:
      - ./data/zerotier:/var/lib/zerotier-one
    networks:
      app-network:
        ipv4_address: 172.31.255.2
    ports:
      - "${ZT_BIND_ADDRESS:-0.0.0.0}:${ZT_PUBLIC_PORT:-9993}:9993/udp"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "zerotier-cli", "-D/var/lib/zerotier-one", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ztnet-init:
    image: ${ZTPLANET_ZTNET_IMAGE:-docker.io/dlaq/zerotier-planet-test:ztnet-${ZTPLANET_RELEASE:-v1.1.0}}
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 0:0 /data /backups && chmod 0750 /data /backups && chown -R 1001:1001 /data /backups"]
    volumes:
      - ./data/ztnet-planet:/data
      - ./data/ztnet-backups:/backups
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25

  ztnet:
    image: ${ZTPLANET_ZTNET_IMAGE:-docker.io/dlaq/zerotier-planet-test:ztnet-${ZTPLANET_RELEASE:-v1.1.0}}
    restart: unless-stopped
    user: "1001:1001"
    env_file:
      - path: /etc/ztplanet/runtime.env
        required: false
      - path: /etc/ztplanet/generated/stack.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ZT_ADDR: http://zerotier:9993
      ZT_SECRET_FILE: /run/zerotier-controller/authtoken.secret
      ZT_IDENTITY_PUBLIC_FILE: /run/zerotier-controller/identity.public
      NEXTAUTH_URL_INTERNAL: http://ztnet:3000
      ZTPLANET_AGENT_SOCKET: /run/ztplanet/agent.sock
      ZTPLANET_AGENT_SECRET_FILE: /run/ztplanet/agent.secret
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - ./data/zerotier:/run/zerotier-controller:ro
      - ./data/ztnet-planet:/var/lib/zerotier-one
      - ./data/ztnet-backups:/app/tmp/backups
      - /run/ztplanet/agent.sock:/run/ztplanet/agent.sock
      - /etc/ztplanet/agent.secret:/run/ztplanet/agent.secret:ro
    ports:
      - "127.0.0.1:3000:3000/tcp"
    networks:
      app-network:
        ipv4_address: 172.31.255.3
    depends_on:
      postgres:
        condition: service_healthy
      zerotier:
        condition: service_healthy
      ztnet-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      # ARM 首次启动可能要先完成 Prisma migration/seed，给应用足够预热时间。
      start_period: 90s

  gateway-init:
    image: ${ZTPLANET_POSTGRES_IMAGE:-docker.io/dlaq/zerotier-planet-test:postgres-${ZTPLANET_RELEASE:-v1.1.0}}
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 0:0 /data /config && chmod 0700 /data /config && chown -R 1002:1002 /data /config"]
    volumes:
      - ./data/gateway-data:/data
      - ./data/gateway-config:/config
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25

  gateway:
    image: ${ZTPLANET_GATEWAY_IMAGE:-docker.io/dlaq/zerotier-planet-test:gateway-${ZTPLANET_RELEASE:-v1.1.0}}
    restart: unless-stopped
    network_mode: host
    user: "1002:1002"
    volumes:
      - /etc/ztplanet/generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ztplanet/tls:/etc/ztplanet/tls:ro
      - ./data/gateway-data:/data
      - ./data/gateway-config:/config
    depends_on:
      gateway-init:
        condition: service_completed_successfully
      ztnet:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  relay:
    image: ${ZTPLANET_RELAY_IMAGE:-docker.io/dlaq/zerotier-planet-test:relay-${ZTPLANET_RELEASE:-v1.1.0}}
    profiles: ["relay"]
    restart: unless-stopped
    env_file:
      - path: /etc/ztplanet/generated/stack.env
        required: false
    environment:
      RELAY_LISTEN: 0.0.0.0:4443
      RELAY_METRICS_LISTEN: 0.0.0.0:9090
    networks:
      relay-egress:
        ipv4_address: 172.31.254.2
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:${RELAY_PORT:-4443}:4443/tcp"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
    security_opt:
      - no-new-privileges:true
      - seccomp=/opt/ztplanet/security/relay-seccomp.json
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/usr/local/bin/ztplanet-relay", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.255.0/24
  relay-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.254.0/28
